<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Churn Prediction</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>📊 Customer Churn Prediction</h1>

    <form action="/predict" method="POST">

        <div class="grid">

            <div>

                <label>Gender</label>
                <select name="gender">
                    <option>Male</option>
                    <option>Female</option>
                </select>

                <label>Senior Citizen</label>
                <select name="SeniorCitizen">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>

                <label>Partner</label>
                <select name="Partner">
                    <option>No</option>
                    <option>Yes</option>
                </select>

                <label>Dependents</label>
                <select name="Dependents">
                    <option>No</option>
                    <option>Yes</option>
                </select>

                <label>Tenure (Months)</label>
                <input type="number" name="tenure" min="0" max="72" required>

                <label>Phone Service</label>
                <select name="PhoneService">
                    <option>No</option>
                    <option>Yes</option>
                </select>

                <label>Multiple Lines</label>
                <select name="MultipleLines">
                    <option>No</option>
                    <option>Yes</option>
                    <option>No phone service</option>
                </select>

                <label>Internet Service</label>
                <select name="InternetService">
                    <option>DSL</option>
                    <option>Fiber optic</option>
                    <option>No</option>
                </select>

                <label>Online Security</label>
                <select name="OnlineSecurity">
                    <option>No</option>
                    <option>Yes</option>
                    <option>No internet service</option>
                </select>

            </div>

            <div>

                <label>Online Backup</label>
                <select name="OnlineBackup">
                    <option>No</option>
                    <option>Yes</option>
                    <option>No internet service</option>
                </select>

                <label>Device Protection</label>
                <select name="DeviceProtection">
                    <option>No</option>
                    <option>Yes</option>
                    <option>No internet service</option>
                </select>

                <label>Tech Support</label>
                <select name="TechSupport">
                    <option>No</option>
                    <option>Yes</option>
                    <option>No internet service</option>
                </select>

                <label>Streaming TV</label>
                <select name="StreamingTV">
                    <option>No</option>
                    <option>Yes</option>
                    <option>No internet service</option>
                </select>

                <label>Streaming Movies</label>
                <select name="StreamingMovies">
                    <option>No</option>
                    <option>Yes</option>
                    <option>No internet service</option>
                </select>

                <label>Contract</label>
                <select name="Contract">
                    <option>Month-to-month</option>
                    <option>One year</option>
                    <option>Two year</option>
                </select>

                <label>Paperless Billing</label>
                <select name="PaperlessBilling">
                    <option>No</option>
                    <option>Yes</option>
                </select>

                <label>Payment Method</label>
                <select name="PaymentMethod">
                    <option>Electronic check</option>
                    <option>Mailed check</option>
                    <option>Bank transfer (automatic)</option>
                    <option>Credit card (automatic)</option>
                </select>

                <label>Monthly Charges</label>
                <input type="number" step="0.01" name="MonthlyCharges" required>

                <label>Total Charges</label>
                <input type="number" step="0.01" name="TotalCharges" required>

            </div>

        </div>

        <button type="submit">🔮 Predict</button>

    </form>

    {% if prediction %}

    <div class="result">

        <h2>{{ prediction }}</h2>

        <p><strong>Confidence:</strong> {{ confidence }}</p>

        <p>🟢 Stay Probability: <strong>{{ stay_probability }}</strong></p>

        <p>🔴 Churn Probability: <strong>{{ churn_probability }}</strong></p>

    </div>

    {% endif %}

    {% if error %}

    <div class="error">

        <p>{{ error }}</p>

    </div>

    {% endif %}

</div>

</body>

</html>
